name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'render.yaml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse et tests
        run: |
          flutter analyze
          flutter test

      # Notifications push : contenu de google-services.json encodé en base64 (secret facultatif).
      - name: Configuration Firebase (secret GOOGLE_SERVICES_JSON, optionnel)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Firebase configuré."
          else
            echo "Pas de google-services.json : notifications push désactivées dans cet APK."
          fi

      - name: Build APK release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk voom-delivery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: voom-delivery-apk
          path: voom-delivery.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VOOM Delivery – build ${{ github.run_number }}
          body: |
            APK Android de VOOM Delivery (commit ${{ github.sha }}).
            API : https://voom-delivery-api.onrender.com/api/v1
          files: voom-delivery.apk
          make_latest: true
