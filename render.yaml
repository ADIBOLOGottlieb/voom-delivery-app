# Blueprint Render : API Laravel VOOM Delivery + base PostgreSQL.
# Render > New > Blueprint > sélectionner ce dépôt.
services:
  - type: web
    name: voom-delivery-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: VOOM Delivery
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://voom-delivery-api.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: voom-delivery-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Paiement Flooz / Mixx by Yas : kkiapay (recommandé, 1,9 %) | paygate | manual
      # Sans clés renseignées, l'app repasse automatiquement en mode manuel (capture d'écran).
      - key: PAYMENT_GATEWAY
        value: kkiapay
      - key: KKIAPAY_PUBLIC_KEY
        sync: false
      - key: KKIAPAY_PRIVATE_KEY
        sync: false
      - key: KKIAPAY_SECRET
        sync: false
      - key: KKIAPAY_WEBHOOK_SECRET
        sync: false
      # true = clés de test ; passer à false avec les clés de production
      - key: KKIAPAY_SANDBOX
        value: "true"
      - key: PAYGATE_AUTH_TOKEN
        sync: false
    # Le disque d'une instance « free » est éphémère : captures de paiement et photos produits
    # sont perdues à chaque redéploiement. En production, passer en plan payant et ajouter :
    # disk:
    #   name: voom-storage
    #   mountPath: /var/www/html/storage/app
    #   sizeGB: 1

databases:
  - name: voom-delivery-db
    databaseName: voom_delivery
    region: frankfurt
    plan: free
