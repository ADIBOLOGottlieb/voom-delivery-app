<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-label="VOOM Delivery">
  <!-- Logo VOOM Delivery (reconstitution) : le V, deux roues de moto pour les O, le M. -->
  <rect width="420" height="150" rx="28" fill="#000000"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Traits de vitesse -->
    <g stroke="#FFFFFF" stroke-width="7">
      <path d="M32 62 H56"/>
      <path d="M22 80 H56"/>
      <path d="M34 98 H56"/>
    </g>
    <!-- V -->
    <path d="M70 40 L96 112 L122 40" stroke="#FFD700" stroke-width="18"/>
    <!-- O O : roues -->
    <circle cx="166" cy="88" r="27" stroke="#FFD700" stroke-width="13"/>
    <circle cx="286" cy="88" r="27" stroke="#FFD700" stroke-width="13"/>
    <!-- Bras oscillant et fourche -->
    <path d="M166 88 L204 70" stroke="#FFD700" stroke-width="8"/>
    <path d="M258 44 L286 88" stroke="#FFD700" stroke-width="9"/>
    <!-- Pilote : dos et bras -->
    <path d="M190 52 L208 32" stroke="#FFD700" stroke-width="11"/>
    <path d="M212 38 L250 38" stroke="#FFD700" stroke-width="6"/>
    <!-- Guidon -->
    <path d="M248 34 L266 30" stroke="#FFFFFF" stroke-width="7"/>
    <!-- M -->
    <path d="M336 112 V44 L364 82 L392 44 V112" stroke="#FFD700" stroke-width="18"/>
  </g>
  <!-- Selle + réservoir -->
  <path d="M150 64 L178 52 L216 52 L232 42 L254 42 L264 54 L240 66 L200 72 Z" fill="#FFD700"/>
  <!-- Moyeux et casque -->
  <circle cx="166" cy="88" r="6" fill="#FFFFFF"/>
  <circle cx="286" cy="88" r="6" fill="#FFFFFF"/>
  <circle cx="213" cy="23" r="11" fill="#FFFFFF"/>
  <path d="M215 19 h9 a2 2 0 0 1 0 6 h-9 z" fill="#000000"/>
  <text x="210" y="140" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700" letter-spacing="9">DELIVERY</text>
</svg>
